name: Build Geode mod

on:
  workflow_dispatch:
  push:
    paths:
      - "GeodeAutoPilotBot.zip"
      - ".github/workflows/build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract mod source from ZIP
        run: |
          mkdir -p project
          unzip -o GeodeAutoPilotBot.zip -d project
          test -f project/mod.json
          test -f project/CMakeLists.txt
          test -f project/src/main.cpp

      - name: Normalize Geode version in mod metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("project/mod.json")
          data = json.loads(p.read_text())
          data["geode"] = "6.0.0-alpha.1"
          p.write_text(json.dumps(data, indent=4) + "\n")
          print(f"Building against Geode SDK {data['geode']}")

      - name: Build Android 64-bit Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: project
          sdk: nightly
          target: Android64
          configure-args: -DCMAKE_UNITY_BUILD=OFF

      - name: Upload built Geode package
        uses: actions/upload-artifact@v4
        with:
          name: AutoPilotBot-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
