name: Build Geode mod

on:
  workflow_dispatch:
  push:
    paths:
      - "AutoPlayerBot.zip"
      - ".github/workflows/build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract mod source from ZIP
        run: |
          mkdir -p project
          unzip -o AutoPlayerBot.zip -d project || true
          test -f project/mod.json
          test -f project/CMakeLists.txt
          test -f project/src/main.cpp

      - name: Fix Android filesystem path conversions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/src/main.cpp")
          s = p.read_text()
          s = s.replace("std::filesystem::create_directories(dir, ec)", "std::filesystem::create_directories(std::filesystem::path(dir.string()), ec)")
          s = s.replace("std::ofstream out(macroPath(key), std::ios::trunc)", "std::ofstream out(macroPath(key).string(), std::ios::trunc)")
          s = s.replace("std::ifstream in(macroPath(key))", "std::ifstream in(macroPath(key).string())")
          s = s.replace("int id = level->m_levelID.value();", "int id = level->m_levelID")
          p.write_text(s)
          print("Applied Android filesystem path compatibility fixes")
          PY

      - name: Set mod name and compatibility metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("project/mod.json")
          data = json.loads(p.read_text())
          data["geode"] = "5.11.2"
          data.setdefault("gd", {})["android"] = "2.2081"
          data["name"] = "AutoPilot X"
          data["version"] = "v1.1.0"
          p.write_text(json.dumps(data, indent=4) + "\n")
          print(f"Building {data['name']} {data['version']} for Geode {data['geode']}")
          PY

      - name: Build Android 64-bit Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: project
          sdk: 5.11.2
          target: Android64
          configure-args: -DCMAKE_UNITY_BUILD=OFF

      - name: Upload built Geode package
        uses: actions/upload-artifact@v4
        with:
          name: AutoPilotX-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
